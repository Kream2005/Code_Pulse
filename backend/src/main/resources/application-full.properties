# Postgres + Kafka (+ optional Mailpit on :1025).
# Activated by: codepulse.mode=full

spring.mail.host=localhost
spring.mail.port=1025

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=codepulse-dev

codepulse.kafka.enabled=true
codepulse.external-api.enabled=true
codepulse.notification.enabled=true
codepulse.notification.to=demo.user@codepulse.local
codepulse.notification.relance.enabled=true
codepulse.notification.relance.delay=2m
codepulse.notification.relance.check-interval=1m
codepulse.notification.relance.initial-delay=45s
codepulse.notification.relance.max=2
