# Demo / restricted PC: Postgres + local Kafka binary + embedded SMTP (GreenMail).
# No Docker. Activated by: spring.profiles.active=standalone

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=codepulse-dev

codepulse.kafka.enabled=true
codepulse.external-api.enabled=true
codepulse.notification.enabled=true
# Relance timing defaults for standalone (on/off: codepulse.notification.relance.enabled in application.properties only).
codepulse.notification.relance.delay=2m
codepulse.notification.relance.check-interval=1m
codepulse.notification.relance.initial-delay=45s
codepulse.notification.relance.max=2

# Mail defaults for demo (GreenMail). Override in gitignored application.properties for real Gmail.
# Do NOT hardcode spring.mail.* here — profile properties would override application.properties.
spring.mail.host=${codepulse.mail.host:127.0.0.1}
spring.mail.port=${codepulse.mail.port:1025}
spring.mail.username=${codepulse.mail.username:}
spring.mail.password=${codepulse.mail.password:}
spring.mail.properties.mail.smtp.auth=${codepulse.mail.smtp.auth:false}
spring.mail.properties.mail.smtp.starttls.enable=${codepulse.mail.smtp.starttls:false}
codepulse.notification.embedded-smtp=${codepulse.notification.use-embedded-smtp:true}
