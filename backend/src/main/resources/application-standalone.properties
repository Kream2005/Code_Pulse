# Demo / restricted PC: Postgres + HTTP publisher only.
# No Kafka, no Mailpit, no Docker.
# Activated by: spring.profiles.active=standalone

codepulse.kafka.enabled=false
codepulse.external-api.enabled=true
codepulse.notification.enabled=false

# Do not auto-configure Kafka or Mail (avoids Mailpit connection errors)
spring.autoconfigure.exclude=\
  org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,\
  org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,\
  org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration,\
  org.springframework.boot.mail.autoconfigure.MailHealthContributorAutoConfiguration
