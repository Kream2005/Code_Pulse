# Demo / restricted PC: Postgres + local Kafka binary + embedded SMTP (GreenMail).
# No Docker. Activated by: spring.profiles.active=standalone

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=codepulse-dev

spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

codepulse.kafka.enabled=true
codepulse.external-api.enabled=true
codepulse.notification.enabled=true
codepulse.notification.embedded-smtp=true
codepulse.notification.relance.enabled=true
codepulse.notification.relance.delay=24h
codepulse.notification.relance.check-interval=15m
codepulse.notification.relance.initial-delay=45s
codepulse.notification.relance.max=3
