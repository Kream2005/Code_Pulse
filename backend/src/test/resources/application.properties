spring.mail.host=localhost
spring.mail.port=1025

spring.datasource.url=jdbc:h2:mem:codepulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.public.key=classpath:public.key
jwt.private.key=classpath:private.key
jwt.issuer=codepulse-test
jwt.access-token-ttl=3600

codepulse.kafka.enabled=false
codepulse.kafka.topics.coding-challenges=coding-challenges
codepulse.kafka.topics.coding-challenges-dlt=coding-challenges-dlt
codepulse.kafka.consumer-group=codepulse-test
codepulse.kafka.retry.max-attempts=3
codepulse.kafka.retry.backoff-ms=1000

codepulse.external-api.enabled=false
codepulse.external-api.coding-challenges-url=http://localhost:9999/api/challenges
codepulse.external-api.connect-timeout=5s
codepulse.external-api.read-timeout=5s

codepulse.notification.enabled=false
codepulse.notification.from=test@codepulse.local
codepulse.notification.to=
codepulse.notification.frontend-base-url=http://localhost:4200
codepulse.cors.allowed-origins=http://localhost:4200

spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
